name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go:
    name: Go Build & Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build static CGO_ENABLED=0 binaries
        run: make build
      - name: Run Go tests with race detector
        run: go test -race -v ./...
      - name: CLI smoke test (blueprint validate + isolated agentd run)
        run: |
          ./bin/agentbox blueprint validate examples/issue-to-pr-app/agentbox.yaml
          ./bin/agentbox run \
            --blueprint examples/issue-to-pr-app/agentbox.yaml \
            --repo examples/issue-to-pr-app \
            --task "CI smoke verification" \
            --mock-llm

  typescript-and-react:
    name: TypeScript SDK & React UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test @agentbox/sdk
        working-directory: sdks/typescript
        run: npm ci && npm test
      - name: Build @agentbox/react
        working-directory: sdks/react
        run: npm ci && npm run build

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agentbox-python unit tests
        working-directory: sdks/python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v
